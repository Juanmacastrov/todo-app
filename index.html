<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Todo</h1>
    <form id="add-form">
      <input id="new-task" type="text" placeholder="Add a task…" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <button id="clear-all" class="clear-all" type="button">Clear all</button>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
    </div>
    <ul id="task-list"></ul>
    <div id="pending-counter" class="pending-counter" aria-live="polite">0 pendientes</div>
  </main>

  <script src="todo-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
